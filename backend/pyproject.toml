[project]
name = "careloop"
version = "0.1.0"
description = "Post-discharge voice follow-up agent for clinics and hospitals, built on Gnani Prisma + Timbre"
authors = [
    { name = "puang59", email = "kk61468@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.3",
    "fastapi>=0.162.0",
    "openai>=3.42.1",
    "pipecat-ai[openai,silero,webrtc]>=1.15.0",
    "pipecat-gnani>=0.6.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "sqlmodel>=0.0.48",
    "sse-starlette>=3.6.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[project.scripts]
careloop = "careloop.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
